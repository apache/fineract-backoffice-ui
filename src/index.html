<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fineract Backoffice UI</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Backoffice administration console for Apache Fineract, a platform-agnostic core banking system."
    />
    <link rel="icon" type="image/png" href="favicon.png" />
    <!-- No webfont <link> belongs here. The UI renders in the platform's own interface font;
         the stack is in src/styles.scss. A third-party font stylesheet would be blocked by the
         deployment CSP (deploy/nginx.conf), would make the production build depend on a network
         fetch, and fails ga:check. Angular keeps HTML comments in the built index.html, so this
         one deliberately names no external host. -->
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
