name: Feature request
description: A screen, field or workflow the back-office UI should support.
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        **Worth raising on the developer mailing list too.** That is where the Fineract
        project decides what it builds, so a feature discussed there arrives with context
        and often a reviewer, while one that only exists in a GitHub issue starts cold.
        Subscribe with a blank email to <dev-subscribe@fineract.apache.org>, then post to
        <dev@fineract.apache.org> — the
        [archive](https://lists.apache.org/list.html?dev@fineract.apache.org) is worth a
        search first.

        For a quicker "is anyone already doing this?", the project chats on Matrix:
        [the Fineract space](https://matrix.to/#/%23apache-fineract-home:matrix.org) and
        [the developer room](https://matrix.to/#/%23apache-fineract-dev:matrix.org).

        If the capability does not exist in the Fineract API yet, it needs to land there
        first — raise that in the
        [ASF Jira project](https://issues.apache.org/jira/projects/FINERACT).

  - type: textarea
    id: problem
    attributes:
      label: What can't you do today
      description: The task you are trying to complete, and where the UI stops you.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
    validations:
      required: true

  - type: input
    id: endpoint
    attributes:
      label: Fineract endpoint
      description: |
        If you know which API this needs, naming it saves a lot of time — the generated
        client in `src/app/api/` almost certainly already has the method.
      placeholder: GET /loans/{loanId}/collaterals

  - type: textarea
    id: alternatives
    attributes:
      label: Workaround you are using now
      description: Helps judge urgency, and sometimes suggests a smaller fix.
