name: PR Comments

# Publishes the comment bodies that CI and the E2E suite rendered, onto the pull request they
# belong to — the E2E summaries, and the sequence diagram of what the change talks to.
#
# This exists because a `pull_request` run from a fork gets a read-only GITHUB_TOKEN — the run
# executes the contributor's code, so GitHub does not let it write here. That left outside
# contributors, the people least able to interpret a raw run, with no comment at all.
#
# `workflow_run` fires after that run finishes and executes the copy of this file on the
# **default branch**, with a token this repository controls. Two consequences worth knowing:
#
#   - Changes to this workflow do not take effect until they are merged. A pull request that
#     edits this file cannot test it; the first real exercise is the first run after merge.
#   - Nothing here may check out or execute the pull request's code. That combination —
#     writable token plus untrusted code — is the "pwn request" vulnerability. The checkout
#     below is deliberately ref-less, which gives the base repository's default branch, and
#     the only thing run is a script from it.
#
# The downloaded summary is untrusted input: it was rendered by a run of the contributor's
# branch, which can modify `scripts/e2e-summary.mjs` freely. It is read as data, never
# evaluated and never interpolated into a `run:` block, and the target pull request is
# resolved from the event rather than from anything in the artifact. See
# .github/scripts/post-e2e-comments.js for the rest of the reasoning.

on:
  # zizmor: ignore[dangerous-triggers] — the point of this workflow, and safe here: no
  # checkout of the pull request's code, and the artifact is treated as untrusted data.
  workflow_run:
    workflows: ['CI', 'E2E Tests']
    types: [completed]

concurrency:
  # Keyed on which workflow completed as well as on the commit. `github.workflow` is this
  # workflow's own name — the same string whichever run triggered it — so without the id, CI's
  # publisher and E2E's publisher share a group for the same commit, and `cancel-in-progress`
  # makes whichever finishes second kill the first. The numeric `workflow_id` is used rather
  # than the name because a `pull_request` run builds its workflow from the pull request's own
  # head, which makes the name contributor-controlled.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.workflow_id }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  comment:
    name: Publish the rendered comments
    # Only runs that came from a pull request have one to comment on. A push to a branch with
    # no open pull request is filtered again inside the script, which is where the check that
    # matters lives.
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout of this repository's default branch
      actions: read # list and download the triggering run's artifacts
      pull-requests: write # the comment itself
    steps:
      # No `ref:`. This resolves to the default branch of *this* repository, never the pull
      # request's head — which is the whole reason this job may hold a writable token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      # One step per artifact, each named and each given its own directory, rather than one
      # `pattern: pr-comment-*` download. The script binds a body to the marker it may post
      # under by the directory the body came from, so that layout has to hold whatever a run
      # produced — and a pattern download does not give it. download-artifact resolves the
      # destination as
      #
      #     isSingleArtifactDownload || mergeMultiple || artifacts.length === 1
      #       ? path
      #       : path/<artifact name>
      #
      # so a pattern that matches exactly one artifact extracts it straight into `summaries/`
      # with no directory at all. That is every CI run, because CI renders only the diagram:
      # the file arrived, `summaries/pr-comment-diagram/` did not exist, and a missing
      # directory is indistinguishable from an artifact that was never uploaded — so the
      # diagram comment was dropped silently on every pull request from the day it was added.
      # The E2E summaries were never affected, because that run uploads two.
      #
      # `continue-on-error` is load-bearing: a run renders only some of these — CI the diagram,
      # E2E the summaries — and downloading one that does not exist is the normal case rather
      # than a failure. The script skips whatever is absent.
      - name: Download the change diagram
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: pr-comment-diagram
          path: summaries/pr-comment-diagram

      - name: Download the mocked E2E summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: pr-comment-e2e-mocked
          path: summaries/pr-comment-e2e-mocked

      - name: Download the real-Fineract E2E summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: pr-comment-e2e-backend
          path: summaries/pr-comment-e2e-backend

      - name: Post or update the comments
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const post = require('./.github/scripts/post-e2e-comments.js');
            await post({ github, context, core });
